<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DSH Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 玻璃要有东西可透：背后垫几团柔和的色块 -->
  <div class="wall" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <div class="app-icon"><img src="icons/icon128.png" alt=""></div>
    <div class="brand">
      <div class="name">DSH Bridge</div>
      <div class="tagline" data-i18n="tagline">让 DSH 用你的 Chrome 干活</div>
    </div>
    <span class="ver" id="ver"></span>
  </header>

  <!-- 文字都在 popup.js 的 I18N 里按 Chrome 的界面语言换；这里的中文只是兜底。
       状态卡：骨架固定，只改文字和 class —— 每秒整块重画会让呼吸灯、流动线的动画一直从头播 -->
  <section id="status" class="card hero loading" aria-live="polite">
    <div class="hero-row">
      <span class="orb" id="orb"></span>
      <div class="hero-title"><span id="stTitle" data-i18n="checking">正在检查…</span><small id="stSub"></small></div>
      <button class="icon-btn glassy" type="button" data-act="reconnect" data-i18n-title="reconnect" title="重新连接" aria-label="重新连接">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8a5.2 5.2 0 1 1-1.5-3.7"/><path d="M13.2 2.6v3h-3"/></svg>
      </button>
    </div>
    <div id="stExtra"></div>
    <div class="chain">
      <div class="node" id="nExt">
        <div class="ring"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.3"/><path d="M8 5.7h5.6M6 9.2 3.2 4.3M10 9.2 7.2 14"/></svg></div>
        <b>Chrome</b><small></small>
      </div>
      <div class="wire" id="w1"></div>
      <div class="node" id="nHost">
        <div class="ring"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="7.5" rx="1.6"/><path d="M6 13h4M8 10.5V13"/></svg></div>
        <b data-i18n="nodeHost">本机程序</b><small></small>
      </div>
      <div class="wire" id="w2"></div>
      <div class="node" id="nDsh">
        <div class="ring"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5V6.2a3.2 3.2 0 0 1 3.2-3.2h3.6A3.2 3.2 0 0 1 13 6.2v1.6a3.2 3.2 0 0 1-3.2 3.2H6l-3 2.5z"/><path d="M6.2 7.2h.01M9.8 7.2h.01"/></svg></div>
        <b>DSH</b><small></small>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="card list" id="settings">
      <label class="row toggle">
        <span class="tile green" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 2.2v5.2"/><path d="M4.6 4.4a5 5 0 1 0 6.8 0"/></svg></span>
        <span class="row-main"><span class="row-title" data-i18n="pause">允许 DSH 控制浏览器</span><span class="row-hint" data-i18n="pauseHint">关掉后，DSH 碰不了浏览器</span></span>
        <input type="checkbox" role="switch" data-act="pause" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row toggle">
        <span class="tile blue" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 3.4v15.4c0 .75.9 1.12 1.42.58l3.6-3.76 2.9 5.94c.24.48.82.68 1.3.45l1.9-.92c.48-.23.68-.8.45-1.28l-2.88-5.9 5.2-.18c.77-.03 1.13-.97.56-1.5L6.64 2.7C6.08 2.18 5 2.6 5 3.4z"/></svg></span>
        <span class="row-main"><span class="row-title" data-i18n="cursor">页面里显示 DSH 光标</span><span class="row-hint" data-i18n="cursorHint">只管显示，关掉也照常操作</span></span>
        <input type="checkbox" role="switch" data-act="cursor" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row toggle">
        <span class="tile orange" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="1.8" y="4.6" width="9.6" height="8.6" rx="1.6"/><path d="M4.6 4.6V3.4c0-.9.7-1.6 1.6-1.6h6.4c.9 0 1.6.7 1.6 1.6v5.6c0 .9-.7 1.6-1.6 1.6h-1.2"/></svg></span>
        <span class="row-main"><span class="row-title" data-i18n="window">新页开在单独窗口</span><span class="row-hint" data-i18n="windowHint">关掉就开在你当前窗口的后台</span></span>
        <input type="checkbox" role="switch" data-act="window" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
      <!-- 「允许访问文件网址」没开才显示：Chrome 默认关着，关着时 DSH 往网页里上传文件会失败（issue #7） -->
      <div class="row" id="fileRow" hidden>
        <span class="tile purple" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.8H4.6c-.9 0-1.6.7-1.6 1.6v9.2c0 .9.7 1.6 1.6 1.6h6.8c.9 0 1.6-.7 1.6-1.6V5.8z"/><path d="M9 1.8v4h4M8 12V8.2M6.3 9.8 8 8.1l1.7 1.7"/></svg></span>
        <span class="row-main"><span class="row-title" data-i18n="files">上传文件</span><span class="row-hint" data-i18n="filesHint">先打开「允许访问文件网址」</span></span>
        <button class="link" type="button" data-act="fileAccess" data-i18n="filesGo">去打开</button>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 data-i18n="sessions">正在用浏览器的对话</h2>
      <span class="count" id="sessCount">0</span>
    </div>
    <div id="sessions"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 data-i18n="activity">最近操作</h2>
      <button class="link" id="moreAct" type="button" hidden></button>
    </div>
    <ol id="activity" class="card list activity"></ol>
  </section>

  <footer class="dock">
    <button id="releaseAll" class="pill-btn danger" type="button" data-act="releaseAll" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M5.9 5.9l4.2 4.2M10.1 5.9l-4.2 4.2"/></svg>
      <span data-i18n="releaseAll">全部放开</span>
    </button>
    <button id="copyDiag" class="pill-btn" type="button" data-act="diagnostics">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8.5" rx="2"/><path d="M10.5 5.5V4a2 2 0 0 0-2-2H4.5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1"/></svg>
      <span data-i18n="copyReport">复制问题报告</span>
    </button>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
